<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从容 · Todo 工作台测试预览</title>
<link rel="stylesheet" href="../styles.css"><style>
:root{--background-primary:#fff;--background-secondary:#f7f8f7;--background-modifier-border:#e8ece9;--background-modifier-hover:#f0f3f1;--text-normal:#293733;--text-muted:#87928d;--font-interface:system-ui,"Microsoft YaHei",sans-serif}body{margin:0;background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{min-height:100vh}.test-modal-backdrop{position:fixed;inset:0;background:#24352d55;display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}.test-modal{background:var(--background-primary);border-radius:16px;padding:28px;width:650px;max-width:95vw;max-height:86vh;overflow:auto;box-shadow:0 20px 90px #0003}.test-notice{position:fixed;bottom:15px;right:20px;background:#293733;color:white;padding:15px;border-radius:10px;z-index:999;font-size:13px}
</style><div id="app"></div><script src="preview-runtime.js"></script><script src="../dist/main.js"></script><script>
window.boot=async()=>{const coreText=await fetch('../src/core.cjs').then(r=>r.text());const coreModule={exports:{}};new Function('module',coreText)(coreModule);const C=coreModule.exports;const PluginClass=module.exports;window.p=new PluginClass();p.app=window.testApp;await p.onload();await window.layoutReady();const today=C.localDate();
const examples=[['文献精读：整理研究思路','study','persist',today,'09:00'],['完成综述第二节初稿','work','today',today,'14:00'],['每周复盘与计划','life','persist',C.addDays(today,2),'20:00'],['等待导师反馈','work','waiting',C.addDays(today,-2),''],['周末散步与阅读','life','later',C.addDays(today,4),'']];
for(let i=0;i<examples.length;i++){const[title,listId,quadrant,date,startTime]=examples[i];await p.saveTask({id:'demo-'+i,title,listId,quadrant,date,startTime,endTime:'',repeat:i===0?'daily':'none',status:'open',subtasks:i===0?[{id:'s1',title:'阅读并标注',done:true},{id:'s2',title:'整理摘要',done:false}]:[],createdAt:new Date().toISOString()});}
await p.store.saveSession({id:'session-demo',title:examples[0][0],taskId:'demo-0',segments:[{start:C.parseDate(today).getTime()+9*3600000,end:C.parseDate(today).getTime()+9.5*3600000}],duration:1800000});
await p.updateSettings({stats:[{id:'stat-demo',kind:'folder',value:'科研'}]});p.refresh();window.ready=true;};window.boot();
</script></html>
